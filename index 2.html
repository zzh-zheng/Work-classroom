<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>教室借用・收費・課表</title>
<style>
:root{--bg:#f7f6f2;--card:#fff;--tx:#222;--mu:#777;--bd:#e3e0d8;--ac:#2f6f5e;--ac2:#e8f1ee;--wa:#c0562b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17181a;--card:#222426;--tx:#eee;--mu:#9a9a9a;--bd:#383a3d;--ac:#5fb59d;--ac2:#25352f;--wa:#e8845a}}
:root[data-theme="dark"]{--bg:#17181a;--card:#222426;--tx:#eee;--mu:#9a9a9a;--bd:#383a3d;--ac:#5fb59d;--ac2:#25352f;--wa:#e8845a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 -apple-system,"Noto Sans TC","PingFang TC",sans-serif;padding:12px}
.wrap{max-width:1100px;margin:auto}h1{font-size:20px;margin:4px 0 10px}
.tabs,.bar.sw{display:flex;flex-wrap:nowrap;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;scroll-snap-type:x proximity}
.tabs{margin-bottom:10px;padding-bottom:2px}.tabs::-webkit-scrollbar,.bar.sw::-webkit-scrollbar{display:none}
.tabs>*,.bar.sw>*{flex-shrink:0;white-space:nowrap;scroll-snap-align:start}
button,select,input{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:6px 10px}
button{cursor:pointer}button.on,button.pri{background:var(--ac);color:#fff;border-color:var(--ac)}button.del{color:var(--wa)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:12px}
.bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:10px}.bar .sp{flex:1}
.mu{color:var(--mu);font-size:12px}
.grid{display:grid;gap:4px}.g7{grid-template-columns:repeat(7,minmax(0,1fr))}.g1{grid-template-columns:1fr}
.cell{background:var(--card);border:1px solid var(--bd);border-radius:8px;min-height:70px;padding:4px;cursor:pointer;overflow:hidden}
.cell.out{opacity:.45}.cell.today{border-color:var(--ac);box-shadow:0 0 0 1px var(--ac)}.cell.big{min-height:160px}
.hd{text-align:center;color:var(--mu);font-size:12px}
.chip{--h:150;background:hsla(var(--h),55%,50%,.25);border-left:3px solid hsl(var(--h),55%,45%);border-radius:4px;padding:1px 4px;margin-top:2px;font-size:11px;line-height:1.35;cursor:pointer}
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-bottom:12px}
.sum div{background:var(--ac2);border-radius:10px;padding:10px}.sum b{display:block;font-size:20px}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:6px 8px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}th{color:var(--mu);font-weight:500}td.r,th.r{text-align:right}
.scroll{overflow-x:auto}
.tt{display:grid;grid-template-columns:44px repeat(7,minmax(70px,1fr));min-width:600px}
.th{height:30px;text-align:center;font-size:12px;color:var(--mu);line-height:30px}
.tl{height:44px;font-size:11px;color:var(--mu);text-align:right;padding-right:4px}
.tb{position:relative;height:660px;border-left:1px solid var(--bd);background:repeating-linear-gradient(var(--bd) 0 1px,transparent 1px 44px)}
.blk{--h:150;position:absolute;left:2px;right:2px;overflow:hidden;background:hsla(var(--h),55%,50%,.3);border-left:3px solid hsl(var(--h),55%,45%);border-radius:5px;padding:2px 4px;font-size:11px;line-height:1.3;cursor:pointer}
dialog{border:1px solid var(--bd);border-radius:14px;background:var(--card);color:var(--tx);width:min(420px,94vw);padding:16px}
dialog::backdrop{background:rgba(0,0,0,.4)}
label{display:block;margin:8px 0 2px;font-size:13px;color:var(--mu)}dialog input,dialog select{width:100%}
.row{display:flex;gap:8px}.row>*{flex:1}
</style></head><body><div class="wrap">
<h1>📚 教室借用・收費・課表</h1><div class="mu" style="margin:-6px 0 8px"><span id="who"></span> <button id="lo" style="display:none;padding:2px 10px;font-size:12px" onclick="auth.signOut()">登出</button></div>
<div class="tabs" id="tabs"></div><div id="app"></div></div>
<dialog id="dlg"></dialog>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
window.onerror=(m,s,l)=>{const a=document.getElementById('app');if(a)a.innerHTML='<div class="card"><b>發生錯誤</b><p>'+m+'（第 '+l+' 行）</p></div>'};
const $=s=>document.querySelector(s);
const firebaseConfig={apiKey:"AIzaSyCoeJtARpH7Dn1jV4LwAANbF2zt-20wD2g",authDomain:"work-classroom.firebaseapp.com",projectId:"work-classroom",storageBucket:"work-classroom.firebasestorage.app",messagingSenderId:"535332868950",appId:"1:535332868950:web:6d8ed62ea7099a25b23cf7",measurementId:"G-KYLE6VKV9V"};
let S={bk:[],st:[],roles:[],mem:{},pend:[],room:300},DB=null,auth=null,me={admin:false,id:null,name:'',email:'',perms:null,student:''};
const can=p=>me.admin||!!(me.perms&&me.perms[p]);
const wr=async f=>{try{await f()}catch(e){alert('儲存失敗：'+(e.message||e.code||e))}};
const pad=n=>String(n).padStart(2,'0');
const fd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const add=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const pdt=s=>{const[a,b,c]=s.split('-');return new Date(+a,b-1,+c)};
const mon=d=>add(d,-((d.getDay()+6)%7));
const tm=t=>{const[h,m]=t.split(':');return h*60+ +m};
const hrs=b=>(tm(b.end)-tm(b.start))/60;
const rate=n=>(S.st.find(s=>s.name===n)||{}).rate||0;
const money=n=>'$'+Math.round(n).toLocaleString();
const fh=n=>(Math.round(n*100)/100)+' 小時';
const col=n=>{let h=0;for(const c of n||'x')h=(h*31+c.charCodeAt(0))%360;return h};
const WD='一二三四五六日',wd=d=>WD[(d.getDay()+6)%7];
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let tab='cal',mode='month',cur=new Date(),ttw=mon(new Date());
let F={st:'',pu:'',rs:'',pd:'',from:'',to:''};
const flt=r=>S.bk.filter(b=>(can('all')||b.student===me.student)&&(!F.st||b.student===F.st)&&(!F.pu||b.purpose===F.pu)&&(!F.rs||(F.rs==='1')===!!b.resched)&&(!F.pd||(F.pd==='1')===!!b.paid)&&(!r||((!F.from||b.date>=F.from)&&(!F.to||b.date<=F.to)))).sort((a,b)=>(a.date+a.start).localeCompare(b.date+b.start));
const stOpts=(sel,all)=>(all?'<option value="">全部學生</option>':'')+S.st.map(s=>`<option ${s.name===sel?'selected':''}>${esc(s.name)}</option>`).join('');
function fbar(r){return `<div class="bar sw">${can('all')?`<select onchange="F.st=this.value;go()">${stOpts(F.st,1)}</select>`:''}
<select onchange="F.pu=this.value;go()"><option value="">全部用途</option>${['家教','其他'].map(p=>`<option ${F.pu==p?'selected':''}>${p}</option>`).join('')}</select>
<select onchange="F.rs=this.value;go()"><option value="">調課不拘</option><option value="1" ${F.rs=='1'?'selected':''}>僅調課</option><option value="0" ${F.rs=='0'?'selected':''}>未調課</option></select>
${r?`<select onchange="F.pd=this.value;go()"><option value="">繳費不拘</option><option value="1" ${F.pd=='1'?'selected':''}>已收</option><option value="0" ${F.pd=='0'?'selected':''}>未收</option></select><input type="date" value="${F.from}" onchange="F.from=this.value;go()"> ~ <input type="date" value="${F.to}" onchange="F.to=this.value;go()">
<button onclick="qm(0)">本月</button><button onclick="qm(-1)">上月</button><button onclick="F.from=F.to='';go()">全部期間</button>`:''}</div>`}
function qm(k){const n=new Date();const a=new Date(n.getFullYear(),n.getMonth()+k,1),b=new Date(n.getFullYear(),n.getMonth()+k+1,0);F.from=fd(a);F.to=fd(b);go()}
const chip=b=>`<div class="chip" style="--h:${col(b.student||b.purpose)}" onclick="event.stopPropagation();edit('${b.id}')">${b.start}-${b.end} ${esc(b.student||b.purpose)}${b.resched?' 🔁'+(mode=='month'?'':'（原'+b.orig.slice(5)+'）'):''}</div>`;
function step(n){if(mode=='month')cur=new Date(cur.getFullYear(),cur.getMonth()+n,1);else cur=add(cur,mode=='week'?7*n:n);go()}
function vCal(){
 let ds,title;
 if(mode=='month'){const s=mon(new Date(cur.getFullYear(),cur.getMonth(),1));ds=[...Array(42)].map((_,i)=>add(s,i));title=cur.getFullYear()+'年'+(cur.getMonth()+1)+'月'}
 else if(mode=='week'){const s=mon(cur);ds=[...Array(7)].map((_,i)=>add(s,i));title=fd(s)+' ~ '+fd(add(s,6))}
 else{ds=[cur];title=fd(cur)+'（週'+wd(cur)+'）'}
 const L=flt(0),today=fd(new Date());
 const cell=d=>{const k=fd(d),it=L.filter(b=>b.date==k),out=mode=='month'&&d.getMonth()!=cur.getMonth();
  return `<div class="cell ${mode!='month'?'big':''} ${out?'out':''} ${k==today?'today':''}" onclick="edit(null,'${k}')"><b>${mode=='day'?'':d.getDate()}</b>${mode!='month'?`<span class="mu"> ${mode=='day'?'':d.getMonth()+1+'/'+d.getDate()+' '}週${wd(d)}</span>`:''}${it.map(chip).join('')}</div>`};
 const inV=L.filter(b=>b.date>=fd(ds[0])&&b.date<=fd(ds[ds.length-1])&&(mode!='month'||pdt(b.date).getMonth()==cur.getMonth()));
 return `<div class="bar sw"><button onclick="step(-1)">‹</button><button onclick="cur=new Date();go()">今天</button><button onclick="step(1)">›</button><b>${title}</b><span class="sp"></span>
 ${['month','week','day'].map(m=>`<button class="${mode==m?'on':''}" onclick="mode='${m}';go()">${{month:'月',week:'週',day:'日'}[m]}</button>`).join('')}${can('edit')?'<button class="pri" onclick="edit()">＋ 新增借用</button>':''}</div>${fbar(0)}
 <div class="mu" style="margin-bottom:6px">本頁 ${inV.length} 堂，共 ${fh(inV.reduce((a,b)=>a+hrs(b),0))}</div>
 ${mode=='day'?'':`<div class="grid g7" style="${mode=='week'?'':''}">${'一二三四五六日'.split('').map(x=>`<div class="hd">${x}</div>`).join('')}</div>`}
 <div class="grid ${mode=='day'?'g1':'g7'}" style="margin-top:4px">${ds.map(cell).join('')}</div>`}
function vFee(){
 const L=flt(1),m={};
 L.forEach(b=>{if(b.purpose=='家教'&&b.student){const o=m[b.student]=m[b.student]||{c:0,h:0};o.c++;o.h+=hrs(b);o.p=(o.p||0)+(b.paid?hrs(b)*rate(b.student):0)}});
 const names=Object.keys(m),inc=names.reduce((a,n)=>a+m[n].h*rate(n),0),pa=names.reduce((a,n)=>a+(m[n].p||0),0),H=L.reduce((a,b)=>a+hrs(b),0),rc=H*S.room;
 return fbar(1)+`<div class="sum"><div>學生收費合計<b>${money(inc)}</b></div><div>已收<b>${money(pa)}</b></div><div>未收<b>${money(inc-pa)}</b></div><div>${can('all')?'教室總借用':'總時數'}<b>${fh(H)}</b></div>${can('all')?`<div>教室費用（${money(S.room)}/時）<b>${money(rc)}</b></div><div>收入 − 教室費<b>${money(inc-rc)}</b></div>`:''}</div>
 ${can('pay')?`<div class="bar"><button onclick="payAll(true)">目前篩選結果全部標為已收</button><button onclick="payAll(false)">全部標為未收</button></div>`:''}<div class="card"><b>學生統計</b><div class="scroll"><table><tr><th>學生</th><th class="r">堂數</th><th class="r">總時數</th><th class="r">時薪</th><th class="r">金額</th><th class="r">已收</th><th class="r">未收</th></tr>
 ${names.map(n=>`<tr><td>${esc(n)}</td><td class="r">${m[n].c}</td><td class="r">${fh(m[n].h)}</td><td class="r">${money(rate(n))}</td><td class="r">${money(m[n].h*rate(n))}</td><td class="r">${money(m[n].p||0)}</td><td class="r">${money(m[n].h*rate(n)-(m[n].p||0))}</td></tr>`).join('')||'<tr><td colspan=7 class="mu">沒有符合的家教資料</td></tr>'}
 </table></div></div>
 <div class="card"><b>明細</b><div class="scroll"><table><tr><th>日期</th><th>時間</th><th>用途</th><th>學生</th><th>調課</th><th class="r">時數</th><th class="r">學生金額</th><th>繳費</th>${can('all')?'<th class="r">教室費</th>':''}</tr>
 ${L.map(b=>`<tr onclick="edit('${b.id}')" style="cursor:pointer"><td>${b.date}（${wd(pdt(b.date))}）</td><td>${b.start}-${b.end}</td><td>${b.purpose}</td><td>${esc(b.student)}</td><td>${b.resched?'調自 '+b.orig:''}</td><td class="r">${hrs(b)}</td><td class="r">${b.purpose=='家教'?money(hrs(b)*rate(b.student)):''}</td><td onclick="event.stopPropagation()">${b.purpose=='家教'?(can('pay')?`<input type="checkbox" style="width:auto" ${b.paid?'checked':''} onchange="pay('${b.id}',this.checked)"> `:'')+(b.paid?'已收 '+(b.paidDate||'').slice(5):'未收'):''}</td>${can('all')?`<td class="r">${money(hrs(b)*S.room)}</td>`:''}</tr>`).join('')}</table></div></div>`}
function vTT(){
 const days=[...Array(7)].map((_,i)=>add(ttw,i)),L=flt(0);
 let h=`<div class="bar sw"><button onclick="ttw=add(ttw,-7);go()">‹ 上週</button><button onclick="ttw=mon(new Date());go()">本週</button><button onclick="ttw=add(ttw,7);go()">下週 ›</button><b>${fd(ttw)} ~ ${fd(add(ttw,6))}</b></div>${fbar(0)}<div class="card scroll"><div class="tt"><div><div class="th"></div>${[...Array(15)].map((_,i)=>`<div class="tl">${pad(8+i)}:00</div>`).join('')}</div>`;
 days.forEach(d=>{const k=fd(d);h+=`<div><div class="th">週${wd(d)} ${d.getMonth()+1}/${d.getDate()}</div><div class="tb" onclick="edit(null,'${k}')">${L.filter(b=>b.date==k).map(b=>{const t=Math.max(0,(tm(b.start)-480)*44/60),ht=Math.max(20,hrs(b)*44-2);return `<div class="blk" style="--h:${col(b.student||b.purpose)};top:${t}px;height:${ht}px" onclick="event.stopPropagation();edit('${b.id}')"><b>${esc(b.student||b.purpose)}</b>${b.resched?' 🔁':''}<br>${b.start}-${b.end}</div>`}).join('')}</div></div>`});
 return h+'</div></div>'}
const permL=[['all','看全部學生'],['edit','新增/修改借用'],['fee','看收費'],['pay','標記繳費']];
function vAdm(){const st=n=>`DB.doc('${n}')`;return `<div class="card"><b>身分（角色）</b><div class="mu">擁有此頁編輯權限的人＝管理者，自動具備全部權限。其他人由你在下方指派身分。</div>
${S.roles.map(r=>`<div class="bar"><input value="${esc(r.name)}" style="width:120px" onchange="wr(()=>DB.doc('roles/${r.id}').update({name:this.value}))">${permL.map(([k,x])=>`<label style="margin:0;display:flex;gap:4px;align-items:center"><input type="checkbox" style="width:auto" ${r.perms[k]?'checked':''} onchange="rperm('${r.id}','${k}',this.checked)">${x}</label>`).join('')}<button class="del" onclick="if(confirm('刪除這個身分？持有者會變成未授權'))wr(()=>DB.doc('roles/${r.id}').delete())">刪除</button></div>`).join('')}
<div class="bar"><input id="rn" placeholder="新身分名稱" style="flex:1"><button class="pri" onclick="radd()">新增身分</button>${S.roles.length?'':'<button onclick="rseed()">建立預設身分</button>'}</div></div>
<div class="card"><b>待加入</b><div class="mu">對方用 Email 或 Google 登入一次後，會出現在這裡。</div>${S.pend.filter(p=>!S.mem[p.id]).map(p=>`<div class="bar sw"><span style="flex:1;min-width:140px">${esc(p.name)} <span class="mu">${esc(p.email)}</span></span><button class="pri" onclick="madd('${p.id}')">加入</button><button class="del" onclick="wr(()=>DB.doc('pending/${p.id}').delete())">忽略</button></div>`).join('')||'<div class="mu">目前沒有人在等待</div>'}</div>
<div class="card"><b>成員</b>${Object.keys(S.mem).map(id=>{const m=S.mem[id];return `<div class="bar sw"><span style="flex:1;min-width:140px">${esc(m.name||'')} <span class="mu">${esc(m.email||'')}</span></span><select onchange="wr(()=>DB.doc('members/${id}').update({role:this.value}))">${S.roles.map(x=>`<option value="${x.id}" ${x.id==m.role?'selected':''}>${esc(x.name)}</option>`).join('')}</select><select onchange="wr(()=>DB.doc('members/${id}').update({student:this.value}))"><option value="">（不綁定學生）</option>${stOpts(m.student)}</select><button class="del" onclick="wr(()=>DB.doc('members/${id}').delete())">移除</button></div>`}).join('')||'<div class="mu">還沒有成員</div>'}
<div class="mu">「只看自己」的身分由資料庫規則真正限制，只讀得到綁定學生的資料。</div></div>
<div class="card"><b>教室費用</b><label>每小時教室借用費（元）</label><input type="number" value="${S.room}" onchange="wr(()=>DB.doc('settings/main').set({room:+this.value||0}))"></div>
<div class="card"><b>學生與時薪</b>${S.st.map(s=>`<div class="bar"><span style="flex:1">${esc(s.name)}</span><input type="number" style="width:100px" value="${s.rate}" onchange="wr(()=>DB.doc('students/${s.id}').update({rate:+this.value||0}))"><button class="del" onclick="if(confirm('刪除這位學生？既有借用紀錄不會被刪'))wr(()=>DB.doc('students/${s.id}').delete())">刪除</button></div>`).join('')}
<div class="bar"><input id="nn" placeholder="學生姓名" style="flex:1"><input id="nr" type="number" placeholder="時薪" style="width:100px"><button class="pri" onclick="addSt()">新增</button></div></div>
<div class="card"><b>備份／匯入</b><div class="bar" style="margin-top:6px"><button onclick="exp()">匯出 JSON</button><input type="file" accept=".json" onchange="imp(this)"></div><div class="mu">可匯入舊版（單機版）匯出的備份，會加入現有資料。</div></div>`}
function madd(id){const p=S.pend.find(x=>x.id==id);if(!S.roles.length)return alert('請先建立身分');wr(async()=>{await DB.doc('members/'+id).set({role:S.roles[0].id,student:'',name:p.name,email:p.email});await DB.doc('pending/'+id).delete()})}
function rperm(id,k,v){const r=S.roles.find(x=>x.id==id);wr(()=>DB.doc('roles/'+id).update({perms:Object.assign({},r.perms,{[k]:v})}))}
function radd(){const n=$('#rn').value.trim();if(n)wr(()=>DB.collection('roles').add({name:n,perms:{all:false,edit:false,fee:false}}))}
function rseed(){wr(async()=>{await DB.collection('roles').add({name:'老師／助教',perms:{all:true,edit:true,fee:true}});await DB.collection('roles').add({name:'學生／家長',perms:{all:false,edit:false,fee:true}})})}
function addSt(){const n=$('#nn').value.trim();if(!n||S.st.some(s=>s.name===n))return alert('請輸入不重複的姓名');wr(()=>DB.collection('students').add({name:n,rate:+$('#nr').value||0}))}
function exp(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({bk:S.bk,st:S.st.map(s=>({name:s.name,rate:s.rate})),room:S.room})],{type:'application/json'}));a.download='classroom-backup.json';a.click()}
function imp(el){const f=el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{let d;try{d=JSON.parse(r.result);if(!Array.isArray(d.bk))throw 0}catch(e){return alert('檔案格式不正確')}
 if(!confirm('要匯入 '+d.bk.length+' 筆借用紀錄嗎？'))return;
 wr(async()=>{for(const s of d.st||[])if(!S.st.some(x=>x.name===s.name))await DB.collection('students').add({name:s.name,rate:s.rate||0});
 for(const b of d.bk)await DB.doc('bookings/'+b.id).set(b);if(d.room)await DB.doc('settings/main').set({room:d.room});alert('匯入完成')})};r.readAsText(f)}
function edit(id,date){if(!can('edit'))return;
 const b=id?S.bk.find(x=>x.id==id):{date:date||fd(new Date()),start:'18:00',end:'20:00',purpose:'家教',student:(S.st[0]||{}).name||'',resched:0,orig:''};
 $('#dlg').innerHTML=`<b>${id?'編輯':'新增'}借用</b><label>日期（實際上課日）</label><input type="date" id="f_d" value="${b.date}">
 <div class="row"><div><label>開始</label><input type="time" id="f_s" value="${b.start}"></div><div><label>結束</label><input type="time" id="f_e" value="${b.end}"></div></div>
 <label>用途</label><select id="f_p" onchange="$('#f_sw').style.display=this.value=='家教'?'':'none'"><option ${b.purpose=='家教'?'selected':''}>家教</option><option ${b.purpose=='其他'?'selected':''}>其他</option></select>
 <div id="f_sw" style="${b.purpose=='家教'?'':'display:none'}"><label>家教學生${S.st.length?'':'（請先到「設定」新增學生）'}</label><select id="f_st">${stOpts(b.student)}</select></div>
 <label><input type="checkbox" id="f_r" style="width:auto" ${b.resched?'checked':''} onchange="$('#f_ow').style.display=this.checked?'':'none'"> 這堂是調課</label>
 <div id="f_ow" style="${b.resched?'':'display:none'}"><label>原本是哪一天</label><input type="date" id="f_o" value="${b.orig||''}"></div>
 ${id?'':'<label>每週重複（共幾週，1 = 不重複）</label><input type="number" id="f_n" min="1" max="52" value="1">'}
 <div class="bar" style="margin-top:14px"><button class="pri" onclick="sv('${id||''}')">儲存</button><button onclick="$('#dlg').close()">取消</button>${id?`<span class="sp"></span><button class="del" onclick="if(confirm('刪除這筆？')){wr(()=>DB.doc('bookings/${id}').delete());$('#dlg').close()}">刪除</button>`:''}</div>`;
 $('#dlg').showModal()}
function pay(id,v){wr(()=>DB.doc('bookings/'+id).update({paid:v,paidDate:v?fd(new Date()):''}))}
function payAll(v){const L=flt(1).filter(b=>b.purpose=='家教');if(!L.length)return alert('目前沒有符合的家教紀錄');if(!confirm('把目前篩選出的 '+L.length+' 堂標為'+(v?'已收':'未收')+'？'))return;wr(async()=>{for(const b of L)await DB.doc('bookings/'+b.id).update({paid:v,paidDate:v?fd(new Date()):''})})}
function sv(id){
 const o={date:$('#f_d').value,start:$('#f_s').value,end:$('#f_e').value,purpose:$('#f_p').value,student:'',resched:$('#f_r').checked?1:0,orig:''};
 if(o.purpose=='家教'){o.student=$('#f_st').value;if(!o.student)return alert('請選擇學生')}
 if(o.resched){o.orig=$('#f_o').value;if(!o.orig)return alert('請填原本上課日期')}
 if(!o.date||!o.start||!o.end||tm(o.end)<=tm(o.start))return alert('請確認日期與時間（結束要晚於開始）');
 const n=id?1:Math.max(1,Math.min(52,+$('#f_n').value||1)),list=[];
 for(let i=0;i<n;i++)list.push(Object.assign({},o,{date:fd(add(pdt(o.date),7*i)),id:id||Date.now().toString(36)+Math.random().toString(36).slice(2,6)}));
 if(id){const e=S.bk.find(y=>y.id==id)||{};list[0].paid=!!e.paid;list[0].paidDate=e.paidDate||''}else list.forEach(x=>{x.paid=false;x.paidDate=''});
 const clash=list.filter(x=>S.bk.some(y=>y.id!=x.id&&y.date==x.date&&tm(y.start)<tm(x.end)&&tm(x.start)<tm(y.end)));
 if(clash.length&&!confirm('有 '+clash.length+' 堂與既有借用時段重疊（'+clash[0].date+' 起），仍要儲存？'))return;
 wr(async()=>{for(const x of list)await DB.doc('bookings/'+x.id).set(x);$('#dlg').close()})}
let L={},unsubs=[],dun=[],dkey='',rsub=0;
const stop=a=>{a.forEach(f=>f());a.length=0};
const perr=e=>{console.error(e);if(e.code!='permission-denied')$('#app').innerHTML='<div class="card">讀取失敗：'+esc(e.message)+'</div>'};
const mapd=s=>s.docs.map(d=>Object.assign({id:d.id},d.data()));
const rcb=s=>{S.roles=mapd(s);L.roles=1;recalc()};
function reset(){stop(unsubs);stop(dun);L={};dkey='';rsub=0;S.bk=[];S.st=[];S.roles=[];S.mem={};S.pend=[];me.id=null;me.admin=false}
function recalc(){
 const m=S.mem[me.id],r=m&&S.roles.find(x=>x.id==m.role);
 if(!me.admin&&m&&!rsub){rsub=1;unsubs.push(DB.collection('roles').onSnapshot(rcb,perr))}
 if(me.admin||r){const all=me.admin||!!r.perms.all,key=all+'|'+(m?m.student:'');
  if(key!=dkey){dkey=key;stop(dun);L.bk=L.st=0;
   if(!all&&!m.student){S.bk=[];S.st=[];L.bk=L.st=1}
   else{const qb=all?DB.collection('bookings'):DB.collection('bookings').where('student','==',m.student);
    const qs=all?DB.collection('students'):DB.collection('students').where('name','==',m.student);
    dun.push(qb.onSnapshot(s=>{S.bk=mapd(s);L.bk=1;go()},perr),qs.onSnapshot(s=>{S.st=mapd(s);L.st=1;go()},perr));}
   dun.push(DB.doc('settings/main').onSnapshot(d=>{S.room=d.exists?d.data().room:300;go()},perr))}}
 go()}
async function enter(u){
 reset();me.id=u.uid;me.name=u.displayName||u.email||'使用者';me.email=u.email||'';
 try{me.admin=(await DB.doc('admins/'+u.uid).get()).exists}catch(e){}
 if(me.admin){
  unsubs.push(DB.collection('members').onSnapshot(s=>{S.mem={};s.docs.forEach(d=>S.mem[d.id]=d.data());L.mem=1;recalc()},perr),
   DB.collection('pending').onSnapshot(s=>{S.pend=mapd(s);go()},perr),DB.collection('roles').onSnapshot(rcb,perr));rsub=1;
 }else{
  DB.doc('pending/'+u.uid).set({name:me.name,email:me.email}).catch(()=>{});
  unsubs.push(DB.doc('members/'+u.uid).onSnapshot(d=>{S.mem=d.exists?{[u.uid]:d.data()}:{};L.mem=1;recalc()},perr))}
 go()}
function go(){
 if(!me.id)return;
 const m=S.mem[me.id],r=m&&S.roles.find(x=>x.id==m.role);me.perms=r?r.perms:null;me.student=m?m.student||'':'';
 $('#who').textContent=me.name+'・'+(me.admin?'管理者':r?r.name:'未授權')+(me.student?'・'+me.student:'');$('#lo').style.display='';
 const load=()=>{$('#tabs').innerHTML='';$('#app').innerHTML='<div class="card mu">載入中…</div>'};
 const unauth=()=>{$('#tabs').innerHTML='';$('#app').innerHTML=`<div class="card"><b>${esc(me.name)}，你好</b><p>你還沒有被指派身分。已通知管理者，核准後請重新整理頁面。</p><button onclick="location.reload()">重新整理</button></div>`};
 if(!L.mem&&!me.admin)return load();
 if(me.admin){if(!L.mem||!L.roles)return load()}else{if(!m)return unauth();if(!L.roles)return load();if(!r)return unauth()}
 if(!(L.bk&&L.st))return load();
 const T=[['cal','📅 借用行事曆']];if(can('fee'))T.push(['fee','💰 收費統計']);T.push(['tt','🗓 週課表']);if(me.admin)T.push(['adm','⚙ 管理']);
 if(!T.some(x=>x[0]==tab))tab='cal';
 $('#tabs').innerHTML=T.map(([k,x])=>`<button class="${tab==k?'on':''}" onclick="tab='${k}';go()">${x}</button>`).join('');
 $('#app').innerHTML={cal:vCal,fee:vFee,tt:vTT,adm:vAdm}[tab]()}
function showLogin(){$('#tabs').innerHTML='';$('#lo').style.display='none';$('#who').textContent='';
 $('#app').innerHTML=`<div class="card" style="max-width:380px;margin:30px auto"><b style="font-size:18px">🔒 登入</b><label>Email</label><input id="em" type="email" autocomplete="username"><label>密碼</label><input id="pw" type="password" autocomplete="current-password"><div id="le" style="color:var(--wa);min-height:22px;margin-top:6px"></div><div class="bar"><button class="pri" onclick="li()">登入</button><button onclick="su()">註冊新帳號</button></div><button style="width:100%" onclick="gl()">用 Google 登入</button><div class="mu" style="margin-top:8px">第一次登入後，需要管理者核准加入。</div></div>`}
const lerr=e=>{const k={'auth/invalid-credential':'帳號或密碼錯誤','auth/invalid-email':'Email 格式不正確','auth/email-already-in-use':'此 Email 已註冊，請直接登入','auth/weak-password':'密碼至少 6 碼','auth/missing-password':'請輸入密碼','auth/popup-closed-by-user':'','auth/unauthorized-domain':'此網址尚未加入 Firebase 的授權網域'};$('#le').textContent=e.code in k?k[e.code]:e.message};
const li=()=>auth.signInWithEmailAndPassword($('#em').value.trim(),$('#pw').value).catch(lerr);
const su=()=>auth.createUserWithEmailAndPassword($('#em').value.trim(),$('#pw').value).catch(lerr);
const gl=()=>auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(lerr);
function boot(){
 if(typeof firebase==='undefined'){$('#app').innerHTML='<div class="card"><b>無法載入 Firebase</b><p>請用 GitHub Pages 的網址（https://你的帳號.github.io/…）在瀏覽器開啟，不要在 Claude 預覽裡開，也請確認網路正常。</p></div>';return}
 if(firebaseConfig.apiKey.startsWith('貼上')){$('#app').innerHTML='<div class="card"><b>還沒設定 Firebase</b><p>請打開 index.html，把最上方的 firebaseConfig 換成你專案的設定（做法見 README）。</p></div>';return}
 firebase.initializeApp(firebaseConfig);auth=firebase.auth();DB=firebase.firestore();
 auth.onAuthStateChanged(u=>{if(u)enter(u);else{reset();showLogin()}})}
$('#app').innerHTML='<div class="card mu">載入中…</div>';boot();
</script></body></html>
